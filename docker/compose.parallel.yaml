name: fqnext_20260223

services:
  fq_mongodb:
    image: mongo:8.2.2
    environment:
      TZ: Asia/Shanghai
    ports:
      - "27027:27017"
    volumes:
      - fqnext_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  fq_redis:
    image: redis:7.0.12-alpine3.18
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - fqnext_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  fq_runtime_clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      TZ: Asia/Shanghai
      CLICKHOUSE_DB: runtime_observability
      CLICKHOUSE_USER: ${FQ_RUNTIME_CLICKHOUSE_USER:-fq_runtime}
      CLICKHOUSE_PASSWORD: ${FQ_RUNTIME_CLICKHOUSE_PASSWORD:-fq_runtime}
    ports:
      - "18123:8123"
      - "19000:9000"
    volumes:
      - fqnext_runtime_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  fq_apiserver:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rear
      args:
        FQ_IMAGE_GIT_SHA: ${FQ_IMAGE_GIT_SHA:-unknown}
      cache_from:
        - type=local,src=${FQ_DOCKER_BUILD_CACHE_ROOT:?Set FQ_DOCKER_BUILD_CACHE_ROOT to the local Docker build cache root}/rear
      cache_to:
        - type=local,dest=${FQ_DOCKER_BUILD_CACHE_ROOT:?Set FQ_DOCKER_BUILD_CACHE_ROOT to the local Docker build cache root}/rear,mode=max
    image: ${FQNEXT_REAR_IMAGE:-fqnext_rear:2026.2.23}
    env_file:
      - ${FQ_COMPOSE_ENV_FILE:?Set FQ_COMPOSE_ENV_FILE to the primary worktree .env}
    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      FQ_RUNTIME_LOG_DIR: /freshquant/logs/runtime
      FQ_RUNTIME_CLICKHOUSE_URL: http://fq_runtime_clickhouse:8123
      FQ_RUNTIME_CLICKHOUSE_DATABASE: runtime_observability
      FQ_RUNTIME_CLICKHOUSE_USER: ${FQ_RUNTIME_CLICKHOUSE_USER:-fq_runtime}
      FQ_RUNTIME_CLICKHOUSE_PASSWORD: ${FQ_RUNTIME_CLICKHOUSE_PASSWORD:-fq_runtime}
      FRESHQUANT_MONGODB__HOST: fq_mongodb
      FRESHQUANT_MONGODB__PORT: "27017"
      FRESHQUANT_REDIS__HOST: fq_redis
      FRESHQUANT_REDIS__PORT: "6379"
      FQ_TRADE_CALENDAR_STATE_DIR: /freshquant/state/trade-calendar
      MONGODB: fq_mongodb
      MONGODB_PORT: "27017"
    command: ["/freshquant/.venv/bin/python", "-m", "freshquant.rear.api_server", "--port", "5000"]
    ports:
      - "15000:5000"
    volumes:
      - fqnext_trade_calendar_state:/freshquant/state/trade-calendar
      - ${FQ_RUNTIME_LOG_HOST_DIR:?Set FQ_RUNTIME_LOG_HOST_DIR to the host runtime log directory}:/freshquant/logs/runtime
      - type: bind
        source: ${FQ_OPS_SNAPSHOT_HOST_DIR:-D:/fqpack/freshquant-2026.2.23/ops-snapshot}
        target: /freshquant/ops-snapshot
        read_only: true
      - type: bind
        source: ${FQPACK_TDX_SYNC_DIR:-D:/new_tdx}
        target: /opt/tdx
    depends_on:
      fq_mongodb:
        condition: service_healthy
      fq_redis:
        condition: service_healthy
      fq_runtime_clickhouse:
        condition: service_healthy
    restart: unless-stopped

  fq_runtime_indexer:
    image: ${FQNEXT_REAR_IMAGE:-fqnext_rear:2026.2.23}
    env_file:
      - ${FQ_COMPOSE_ENV_FILE:?Set FQ_COMPOSE_ENV_FILE to the primary worktree .env}
    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      FQ_RUNTIME_LOG_DIR: /freshquant/logs/runtime
      FQ_RUNTIME_CLICKHOUSE_URL: http://fq_runtime_clickhouse:8123
      FQ_RUNTIME_CLICKHOUSE_DATABASE: runtime_observability
      FQ_RUNTIME_CLICKHOUSE_USER: ${FQ_RUNTIME_CLICKHOUSE_USER:-fq_runtime}
      FQ_RUNTIME_CLICKHOUSE_PASSWORD: ${FQ_RUNTIME_CLICKHOUSE_PASSWORD:-fq_runtime}
      FRESHQUANT_MONGODB__HOST: fq_mongodb
      FRESHQUANT_MONGODB__PORT: "27017"
      FRESHQUANT_REDIS__HOST: fq_redis
      FRESHQUANT_REDIS__PORT: "6379"
      MONGODB: fq_mongodb
      MONGODB_PORT: "27017"
    command: ["/freshquant/.venv/bin/python", "-m", "freshquant.runtime_observability.indexer_main", "--poll-interval-s", "2.0"]
    volumes:
      - ${FQ_RUNTIME_LOG_HOST_DIR:?Set FQ_RUNTIME_LOG_HOST_DIR to the host runtime log directory}:/freshquant/logs/runtime
    depends_on:
      fq_runtime_clickhouse:
        condition: service_healthy
    restart: unless-stopped

  fq_tdxhq:
    image: ${FQNEXT_REAR_IMAGE:-fqnext_rear:2026.2.23}
    env_file:
      - ${FQ_COMPOSE_ENV_FILE:?Set FQ_COMPOSE_ENV_FILE to the primary worktree .env}
    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      FRESHQUANT_MONGODB__HOST: fq_mongodb
      FRESHQUANT_MONGODB__PORT: "27017"
      FRESHQUANT_REDIS__HOST: fq_redis
      FRESHQUANT_REDIS__PORT: "6379"
      MONGODB: fq_mongodb
      MONGODB_PORT: "27017"
    command: ["/freshquant/.venv/bin/python", "-m", "freshquant.gateway.tdxhq", "--port", "5001"]
    ports:
      - "15001:5001"
    depends_on:
      fq_mongodb:
        condition: service_healthy
    restart: unless-stopped

  fq_dagster_webserver:
    image: ${FQNEXT_REAR_IMAGE:-fqnext_rear:2026.2.23}
    env_file:
      - ${FQ_COMPOSE_ENV_FILE:?Set FQ_COMPOSE_ENV_FILE to the primary worktree .env}
    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      DAGSTER_HOME: /opt/dagster/home
      FRESHQUANT_DAGSTER__HOME: /opt/dagster/home
      JYGS_ENV_FILE: /run/host-config/envs.conf
      FRESHQUANT_TDX_ROOT: /run/host-tdx
      FRESHQUANT_MONGODB__HOST: fq_mongodb
      FRESHQUANT_MONGODB__PORT: "27017"
      FRESHQUANT_REDIS__HOST: fq_redis
      FRESHQUANT_REDIS__PORT: "6379"
      FQ_TRADE_CALENDAR_STATE_DIR: /freshquant/state/trade-calendar
      MONGODB: fq_mongodb
      MONGODB_PORT: "27017"
    command:
      [
        "sh",
        "-lc",
        "mkdir -p /opt/dagster/home; cp -f /freshquant/morningglory/fqdagsterconfig/* /opt/dagster/home/; cd /opt/dagster/home; /freshquant/.venv/bin/dagster-webserver -h 0.0.0.0 -p 10003 -w /opt/dagster/home/workspace.yaml",
      ]
    ports:
      - "11003:10003"
    volumes:
      - fqnext_trade_calendar_state:/freshquant/state/trade-calendar
      - fqnext_dagster_data:/opt/dagster
      - type: bind
        source: ${FQPACK_CONFIG_DIR:-D:/fqpack/config}
        target: /run/host-config
        read_only: true
      - type: bind
        source: ${FQPACK_TDX_DIR:-D:/new_tdx}
        target: /run/host-tdx
        read_only: true
    depends_on:
      fq_mongodb:
        condition: service_healthy
      fq_redis:
        condition: service_healthy
    restart: unless-stopped

  fq_dagster_daemon:
    image: ${FQNEXT_REAR_IMAGE:-fqnext_rear:2026.2.23}
    env_file:
      - ${FQ_COMPOSE_ENV_FILE:?Set FQ_COMPOSE_ENV_FILE to the primary worktree .env}
    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      DAGSTER_HOME: /opt/dagster/home
      FRESHQUANT_DAGSTER__HOME: /opt/dagster/home
      JYGS_ENV_FILE: /run/host-config/envs.conf
      FRESHQUANT_TDX_ROOT: /run/host-tdx
      FRESHQUANT_MONGODB__HOST: fq_mongodb
      FRESHQUANT_MONGODB__PORT: "27017"
      FRESHQUANT_REDIS__HOST: fq_redis
      FRESHQUANT_REDIS__PORT: "6379"
      FQ_TRADE_CALENDAR_STATE_DIR: /freshquant/state/trade-calendar
      MONGODB: fq_mongodb
      MONGODB_PORT: "27017"
    command:
      [
        "sh",
        "-lc",
        "mkdir -p /opt/dagster/home; cp -f /freshquant/morningglory/fqdagsterconfig/* /opt/dagster/home/; /freshquant/.venv/bin/dagster-daemon run -w /opt/dagster/home/workspace.yaml",
      ]
    volumes:
      - fqnext_trade_calendar_state:/freshquant/state/trade-calendar
      - fqnext_dagster_data:/opt/dagster
      - type: bind
        source: ${FQPACK_CONFIG_DIR:-D:/fqpack/config}
        target: /run/host-config
        read_only: true
      - type: bind
        source: ${FQPACK_TDX_DIR:-D:/new_tdx}
        target: /run/host-tdx
        read_only: true
    depends_on:
      fq_mongodb:
        condition: service_healthy
      fq_redis:
        condition: service_healthy
    restart: unless-stopped

  fq_qawebserver:
    image: ${FQNEXT_REAR_IMAGE:-fqnext_rear:2026.2.23}
    env_file:
      - ${FQ_COMPOSE_ENV_FILE:?Set FQ_COMPOSE_ENV_FILE to the primary worktree .env}
    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      FRESHQUANT_MONGODB__HOST: fq_mongodb
      FRESHQUANT_MONGODB__PORT: "27017"
      FRESHQUANT_REDIS__HOST: fq_redis
      FRESHQUANT_REDIS__PORT: "6379"
      MONGODB: fq_mongodb
      MONGODB_PORT: "27017"
    command: ["/freshquant/.venv/bin/python", "-m", "QUANTAXIS.QAWebServer.server"]
    ports:
      - "18010:8010"
    depends_on:
      fq_mongodb:
        condition: service_healthy
    restart: unless-stopped

  fq_webui:
    build:
      context: ../morningglory/fqwebui
      dockerfile: ../../docker/Dockerfile.web
      args:
        FQ_IMAGE_GIT_SHA: ${FQ_IMAGE_GIT_SHA:-unknown}
      cache_from:
        - type=local,src=${FQ_DOCKER_BUILD_CACHE_ROOT:?Set FQ_DOCKER_BUILD_CACHE_ROOT to the local Docker build cache root}/web
      cache_to:
        - type=local,dest=${FQ_DOCKER_BUILD_CACHE_ROOT:?Set FQ_DOCKER_BUILD_CACHE_ROOT to the local Docker build cache root}/web,mode=max
    image: ${FQNEXT_WEBUI_IMAGE:-fqnext_webui:2026.2.23}
    ports:
      - "18080:80"
    volumes:
      # CLX 市场上下文评价数据（每日 publish 产物）出 git，由宿主外部目录挂载提供，
      # 前端 /data/clx-evaluator/** 直接命中该目录，无需每次 rebuild 镜像。
      - type: bind
        source: ${CLX_EVAL_DATA_DIR:-D:/fqpack/runtime/artifacts/clx-evaluator}
        target: /usr/share/nginx/html/data/clx-evaluator
    depends_on:
      fq_apiserver:
        condition: service_started
      fq_qawebserver:
        condition: service_started
    restart: unless-stopped

volumes:
  fqnext_mongodb_data:
  fqnext_redis_data:
  fqnext_runtime_clickhouse_data:
  fqnext_dagster_data:
  fqnext_trade_calendar_state:
